databaseChangeLog:
  - changeSet:
      id: ddl-tables-001
      author: JUANDAX233
      labels: "HU-APPT-001,ddl,tables"
      comment: "appointment: the booking, its status and the price snapshot; client_id is null only for a walk-in."
      changes:
        - sqlFile:
            path: 001_create_appointment.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/001_create_appointment.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
  - changeSet:
      id: ddl-tables-002
      author: JUANDAX233
      labels: "HU-APPT-001,ddl,tables"
      comment: "idempotency_key: makes every booking safe to retry (norm 5.3.8)."
      changes:
        - sqlFile:
            path: 002_create_idempotency_key.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/002_create_idempotency_key.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
  - changeSet:
      id: ddl-tables-003
      author: JUANDAX233
      labels: "HU-APPT-001,ddl,tables"
      comment: "outbox_event: the change and its event commit together; completing no longer writes to finance (norm 5.3.11)."
      changes:
        - sqlFile:
            path: 003_create_outbox_event.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/003_create_outbox_event.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
